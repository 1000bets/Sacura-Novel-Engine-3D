log_format safe_paths '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
upstream api_backend {
 zone api_backend 64k;
 resolver 127.0.0.11 valid=10s ipv6=off;
 server api:3000 resolve;
}
server {
 listen 8080;
 server_tokens off;
 # The dedicated production edge network assigns this address only to Caddy.
 set_real_ip_from 172.29.251.2;
 real_ip_header X-Forwarded-For;
 # Log paths only: invite tokens appear in query strings.
 access_log /var/log/nginx/access.log safe_paths;
 root /usr/share/nginx/html;
 client_max_body_size 32m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
 location = /health { access_log off; return 200 'ok'; }
 location /api/ {
  limit_req zone=api_limit burst=30 nodelay;
  limit_req_status 429;
  proxy_pass http://api_backend;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
 }
 # This SPA entry carries the invite secret. Do not include its full request
 # in upstream/filesystem error messages; access logs above already omit queries.
 location = /register {
  error_log /dev/null;
  try_files /index.html =404;
  expires -1;
 }
 location / {
  try_files $uri $uri/ /index.html;
  expires -1;
 }
}
