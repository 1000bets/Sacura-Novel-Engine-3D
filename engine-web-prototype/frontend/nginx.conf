limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
upstream api_backend {
 zone api_backend 64k;
 resolver 127.0.0.11 valid=10s ipv6=off;
 server api:3000 resolve;
}
server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 32m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
 location = /health { access_log off; return 200 'ok'; }
 location /api/ {
  limit_req zone=api_limit burst=30 nodelay;
  limit_req_status 429;
  proxy_pass http://api_backend;
  proxy_set_header Host $http_host;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
 }
 location / {
  try_files $uri $uri/ /index.html;
  expires -1;
 }
}
