<!doctype html>
<html lang="ru" style="background:#11121b">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#11121b"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="stylesheet" href="%BASE_URL%loading-screen.css"/>
  <title>Sacura Studio · Письма после дождя</title>
</head>
<body style="margin:0">
  <div id="root">
    <div class="sacura-loading" data-boot-splash aria-busy="true">
      <div class="sacura-loading-card">
        <div class="sacura-loading-mark" aria-hidden="true">
          <!-- Flower2, lucide (ISC), also used by the React shell. -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1"/>
            <circle cx="12" cy="8" r="2"/>
            <path d="M12 10v12M12 22c4.2 0 7-1.667 7-5-4.2 0-7 1.667-7 5ZM12 22c-4.2 0-7-1.667-7-5 4.2 0 7 1.667 7 5Z"/>
          </svg>
        </div>
        <h1>Sacura</h1><div class="sacura-loading-brand">NOVEL STUDIO</div>
        <div class="sacura-loading-track" aria-hidden="true"></div>
        <p class="sacura-loading-status" role="status">Запускаем студию…</p>
        <button type="button" data-boot-retry hidden>Попробовать снова</button>
      </div>
      <div class="sacura-loading-footer">Место для ваших историй</div>
    </div>
  </div>
  <script type="module" src="/src/bootstrap.js"></script>
</body>
</html>
