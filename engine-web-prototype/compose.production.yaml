services:
  api:
    environment:
      COOKIE_SECURE: "true"
  web:
    ports: !reset []
  caddy:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your domain name}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  caddy_data:
  caddy_config:
